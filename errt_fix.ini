[errt_fix]
; errt_fix - Elden Ring ray tracing stutter fix
; Offline use only, with Easy Anti-Cheat disabled.

; Prebuilt ray tracing pipeline. RT materials are recorded in errt_fix\rt_pipeline_cache.bin, and a
; pipeline containing all of them is linked in the background at startup, so the game does not relink
; its RT pipeline on the render thread when a new material appears.
rt_cache=1
; Maximum number of material collections in the prebuilt pipeline (the game has about 1064).
rt_cache_max=2000

; Scans process memory for every RT material and adds it to the cache. Use once on a new system:
; set to 1, wait about one minute in the main menu, quit, and set back to 0.
rt_scan=0
rt_scan_seconds=30

; BLAS refit thinning: a bottom-level acceleration structure that was built or refit within the last
; refit_frames frames is not updated again (animated foliage is refit every frame by default).
refit_thinning=1
refit_frames=2

; Pipeline state reuse: a pipeline requested again is created from the driver binary of the first
; compile instead of being compiled again.
pso_reuse=1
; Minimum compile time in milliseconds for a driver binary to be kept.
pso_reuse_min_ms=2
